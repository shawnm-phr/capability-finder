<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capability → Module Mapping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EDF0F6;
    --bg-grid: #E2E7F0;
    --surface: #FFFFFF;
    --ink: #12172B;
    --muted: #5B6478;
    --faint: #99A1B5;
    --line: #DBE0EA;
    --line-strong: #C3CADA;
    --good: #1DB876;

    --hr: #3A5CFF;
    --time: #F2994A;
    --pay: #1DB876;
    --talent: #8B5CF6;
    --engagement: #16B8C4;
    --recruitment: #F2418A;
    --insights: #2F8FE0;

    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-pill: 999px;
    --shadow: 0 24px 48px -28px rgba(18,23,43,.28), 0 4px 12px -6px rgba(18,23,43,.08);
    --font-display: 'Space Grotesk', 'Inter', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(circle at 1px 1px, var(--bg-grid) 1px, transparent 0) 0 0/28px 28px,
      var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    min-height: 100vh;
    padding: 40px 20px 60px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{ max-width: 860px; margin: 0 auto; }

  .eyebrow{
    display:flex; align-items:center; justify-content:space-between;
    font-family: var(--font-mono);
    font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 50px;
  }
  .eyebrow .dot{ color: var(--line-strong); margin: 0 10px; }
  .eyebrow .stat b{ color: var(--ink); font-weight: 500; }
  .eyebrow .brand{ display:flex; align-items:center; gap:10px; }
  .eyebrow .logo{ height:34px; width:auto; display:block; }

  h1{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(28px, 4.4vw, 42px);
    line-height: 1.08;
    letter-spacing: -0.015em;
    margin: 0 0 24px;
  }
  .sub{
    color: var(--muted);
    font-size: 15px;
    margin: 0 0 32px;
    max-width: 46ch;
  }

  .toggle-row{
    display:flex; align-items:center; gap:14px;
    margin-bottom: 28px;
  }
  .toggle{
    position:relative;
    display:inline-flex;
    background: var(--surface);
    border: 1.5px solid var(--ink);
    border-radius: var(--radius-pill);
    padding: 4px;
    box-shadow: var(--shadow);
  }
  .toggle .thumb{
    position:absolute;
    top:4px; bottom:4px; left:4px;
    width: calc(50% - 4px);
    background: var(--ink);
    border-radius: var(--radius-pill);
    transition: transform .45s cubic-bezier(.65,0,.35,1);
    z-index: 0;
  }
  .toggle.is-mod .thumb{ transform: translateX(100%); }
  .toggle button{
    position:relative; z-index:1;
    border:none; background:transparent; cursor:pointer;
    font-family: var(--font-display); font-weight:600; font-size:14px;
    padding: 11px 20px;
    border-radius: var(--radius-pill);
    color: var(--ink);
    transition: color .3s ease;
    white-space: nowrap;
  }
  .toggle button.active{ color: #fff; }

  .flip-icon{
    width:38px; height:38px;
    border-radius:50%;
    border: 1.5px solid var(--ink);
    background: var(--surface);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition: background .25s ease;
  }
  .flip-icon:hover{ background: var(--bg-grid); }
  .flip-icon svg{ width:18px; height:18px; transition: transform .5s cubic-bezier(.65,0,.35,1); }
  .flip-icon.spin svg{ transform: rotate(180deg); }

  .plans-btn{
    margin-left:auto;
    display:inline-flex; align-items:center; gap:7px;
    font-family: var(--font-display); font-weight:600; font-size:13.5px;
    color: var(--ink);
    background: var(--surface);
    border: 1.5px solid var(--ink);
    border-radius: var(--radius-pill);
    padding: 10px 18px;
    text-decoration:none;
    white-space:nowrap;
    transition: background .2s ease, color .2s ease;
  }
  .plans-btn svg{ width:13px; height:13px; flex-shrink:0; }
  .plans-btn:hover{ background: var(--ink); color:#fff; }

  .stage{ perspective: 1800px; }
  .card3d{
    position:relative;
    width:100%;
    transform-style: preserve-3d;
    transition: transform .7s cubic-bezier(.65,0,.35,1);
    min-height: 220px;
  }
  .card3d.flipped{ transform: rotateY(180deg); }
  .face{ backface-visibility: hidden; width:100%; }
  .face.back{ position:absolute; top:0; left:0; transform: rotateY(180deg); }

  .search-pill{
    position:relative;
    display:flex; align-items:center; gap:12px;
    background: var(--surface);
    border: 1.5px solid var(--ink);
    border-radius: var(--radius-pill);
    padding: 6px 8px 6px 22px;
    box-shadow: var(--shadow);
    margin-bottom: 26px;
    transition: opacity .3s ease;
  }
  #capSearchBlock.hidden-mode{ display:none; }
  .search-pill svg{ flex-shrink:0; color: var(--muted); }
  .search-pill input{
    flex:1; border:none; outline:none; background:transparent;
    font-family: var(--font-body); font-size:16px; color: var(--ink);
    padding: 12px 0;
  }
  .search-pill input::placeholder{ color: var(--faint); }
  .search-pill .kbd{
    font-family: var(--font-mono); font-size:11px; color: var(--faint);
    border: 1px solid var(--line); border-radius:6px; padding:3px 7px;
    flex-shrink:0;
  }

  .clear-btn{
    display:none;
    align-items:center; justify-content:center;
    width:26px; height:26px;
    border-radius:50%;
    border:none;
    background: var(--bg);
    color: var(--muted);
    cursor:pointer;
    flex-shrink:0;
    padding:0;
    transition: background .15s ease, color .15s ease;
  }
  .clear-btn.show{ display:flex; }
  .clear-btn:hover{ background: var(--line); color: var(--ink); }
  .clear-btn svg{ width:12px; height:12px; }

  .list-count{
    margin: 14px 2px 10px;
    font-family: var(--font-mono); font-size:11.5px; color: var(--faint);
    text-transform: uppercase; letter-spacing:.06em;
  }
  .list-count b{ color: var(--muted); font-weight:500; }
  .sugg-item{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 8px;
    overflow:hidden;
    transition: border-color .15s ease;
  }
  .sugg-item.hi{ border-color: var(--line-strong); }
  .sugg-item.open{ border-color: var(--ink); }
  .sugg-item .swatch{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .sugg-item .cap-name{ font-size:14px; font-weight:500; flex:1; min-width:0; }
  .sugg-item .mod-name{
    margin-left:auto; flex-shrink:0; font-family: var(--font-mono); font-size:11px; color: var(--muted);
    text-transform: uppercase; letter-spacing:.04em;
    display:flex; align-items:center; gap:6px;
  }
  .sugg-item .mod-name .sw{ width:7px; height:7px; border-radius:50%; }
  .sugg-empty{
    text-align:center; padding: 50px 20px; color: var(--faint);
    font-family: var(--font-mono); font-size:13px;
  }
  .bundle-label{
    display:flex; align-items:center; gap:8px;
    font-family: var(--font-display); font-size:16px; text-transform:uppercase; letter-spacing:.03em;
    color: var(--ink); font-weight:700;
    margin: 22px 2px 10px; padding-left: 4px;
  }
  .bundle-label:first-child{ margin-top:0; }
  .bundle-label .sw{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .bundle-label .bcount{
    margin-left:auto; color: var(--faint); font-weight:400;
    font-family: var(--font-mono); font-size:11px; text-transform:none; letter-spacing:normal;
  }

  .sugg-item-head{
    display:flex; align-items:center; gap:12px;
    padding: 13px 16px;
    cursor:pointer;
    transition: background .15s ease;
  }
  .sugg-item-head:hover{ background: var(--bg); }
  .sugg-item .chev{ transition: transform .25s ease; color: var(--faint); flex-shrink:0; }
  .sugg-item.open .chev{ transform: rotate(90deg); }
  .sugg-item-body{ max-height:0; overflow:hidden; transition: max-height .35s ease; }
  .sugg-item.open .sugg-item-body{ max-height: 600px; }
  .sugg-item-body-inner{ padding: 0 16px 18px; }
  .sugg-item-body-inner p.desc{
    color: var(--muted); font-size: 13.5px; line-height:1.6;
    margin: 4px 0 16px; white-space: pre-line;
  }

  .tiers{ display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; }
  .tiers.two-col{ grid-template-columns: repeat(2, 1fr); }
  .tier-box{
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    background: var(--bg);
  }
  .tier-box .tname{
    font-family: var(--font-mono); font-size:10.5px; text-transform:uppercase;
    letter-spacing:.06em; color: var(--muted); margin-bottom:6px; display:block;
  }
  .tier-box .tval{ font-size: 13.5px; font-weight:500; line-height:1.35; }
  .tier-box .tval.tick{ color: var(--good); font-size:17px; }
  .tier-box .tval.dash{ color: var(--faint); }

  .mod-item{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 8px;
    overflow:hidden;
    transition: border-color .15s ease;
  }
  .mod-item.open{ border-color: var(--ink); }
  .mod-item-head{
    display:flex; align-items:center; gap:12px;
    padding: 14px 16px;
    cursor:pointer;
    transition: background .15s ease;
  }
  .mod-item-head:hover{ background: var(--bg); }
  .mod-item-head .swatch{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .mod-item-head .mod-item-name{ font-family: var(--font-display); font-weight:600; font-size:14.5px; flex:1; min-width:0; }
  .mod-item-head .mod-item-count{
    margin-left:auto; flex-shrink:0; font-family: var(--font-mono); font-size:11px; color: var(--muted);
    text-transform: uppercase; letter-spacing:.04em;
  }
  .mod-item .chev{ transition: transform .25s ease; color: var(--faint); flex-shrink:0; }
  .mod-item.open .chev{ transform: rotate(90deg); }
  .mod-item-body{ max-height:0; overflow:hidden; transition: max-height .4s ease; }
  .mod-item.open .mod-item-body{ max-height: 4000px; }
  .mod-item-body-inner{ padding: 4px 16px 16px; }

  .mod-filter{
    position:relative;
    display:flex; align-items:center; gap:12px;
    background: var(--surface);
    border: 1.5px solid var(--ink);
    border-radius: var(--radius-pill);
    padding: 6px 8px 6px 22px;
    box-shadow: var(--shadow);
    margin-bottom: 26px;
  }
  .mod-filter svg{ color: var(--muted); flex-shrink:0; }
  .mod-filter input{
    flex:1; border:none; outline:none; background:transparent;
    font-family: var(--font-body); font-size:16px; color: var(--ink);
    padding: 12px 0;
  }
  .mod-filter input::placeholder{ color: var(--faint); }

  .theme-group{ margin-bottom: 20px; }
  .theme-group h4{
    font-family: var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.07em;
    color: var(--muted); margin: 0 0 10px; padding-left: 4px;
  }
  .row{
    background: var(--surface); border:1px solid var(--line); border-radius: 12px;
    margin-bottom:8px; overflow:hidden;
  }
  .row-head{ display:flex; align-items:center; gap:12px; padding: 13px 16px; cursor:pointer; }
  .row-head .cap-name{ font-size:14px; font-weight:500; flex:1; }
  .row-ticks{ display:flex; gap:14px; font-family: var(--font-mono); font-size:11px; color: var(--muted); }
  .row-ticks b{ color: var(--ink); font-weight:500; }
  .chev{ transition: transform .25s ease; color: var(--faint); flex-shrink:0; }
  .row.open .chev{ transform: rotate(90deg); }
  .row-body{ max-height:0; overflow:hidden; transition: max-height .3s ease; }
  .row.open .row-body{ max-height: 400px; }
  .row-body-inner{ padding: 0 16px 16px; }
  .row-body-inner p{ font-size:13.5px; color: var(--muted); line-height:1.55; margin: 4px 0 14px; white-space: pre-line; }

  .mod-empty{ text-align:center; padding: 60px 20px; color: var(--faint); font-family: var(--font-mono); font-size:13px; }

  /* toggle pill + plans button wrap before their combined intrinsic width outgrows the viewport */
  @media (max-width: 760px){
    .toggle-row{ flex-wrap:wrap; row-gap:10px; }
    .toggle{ width:100%; }
    .toggle button{ flex:1; text-align:center; padding:11px 8px; }
    .plans-btn{ margin-left:0; flex:1; justify-content:center; }
  }

  @media (max-width: 600px){
    .tiers{ grid-template-columns: 1fr; }
    .search-pill, .mod-filter{ padding-left:16px; }
  }

  @media (max-width: 480px){
    body{ padding: 28px 16px 44px; }
    .eyebrow{ margin-bottom: 36px; }
    .eyebrow .logo{ height:26px; }
    .eyebrow .brand{ gap:8px; }
    .toggle button{ font-size:12.5px; padding:10px 4px; }
    .plans-btn{ font-size:12.5px; padding:10px 12px; }
    .sugg-item-head, .mod-item-head, .row-head{ flex-wrap:wrap; row-gap:6px; }
    .sugg-item .mod-name{ margin-left:0; flex-basis:100%; }
    .mod-item-head .mod-item-count{ margin-left:0; flex-basis:100%; }
    .row-ticks{ margin-left:0; flex-basis:100%; }
  }

  @media (max-width: 360px){
    .eyebrow .brand-text{ display:none; }
  }
</style>
</head>

  <div class="toggle-row">
    <div class="toggle" id="toggle">
      <div class="thumb"></div>
      <button id="btnCap" class="active">Capability → Module</button>
      <button id="btnMod">Module → Capability</button>

    <div class="flip-icon" id="flipIcon" title="Flip search direction">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 2.1l4 4-4 4"/><path d="M3 12.1v-2a4 4 0 0 1 4-4h14"/>

    <h1>Search Capability</h1>

    <p class="sub">Search for a capability to find which module it belongs to.</p>

const BUNDLE_COLOR = {
  HR: 'var(--hr)', Time: 'var(--time)', Pay: 'var(--pay)', Talent: 'var(--talent)',
  Engagement: 'var(--engagement)', Recruitment: 'var(--recruitment)', Insights: 'var(--insights)'
};
const BUNDLE_ORDER = ['HR','Time','Pay','Talent','Engagement','Recruitment','Insights'];

/* module -> its (first-seen) bundle, and stable module order */
const MODULE_BUNDLE = {};
const MODULE_ORDER = [];
DATA.forEach(d => {
  if(!(d.m in MODULE_BUNDLE)){ MODULE_BUNDLE[d.m] = d.b; MODULE_ORDER.push(d.m); }
});

const toggle = document.getElementById('toggle');
const btnCap = document.getElementById('btnCap');
const btnMod = document.getElementById('btnMod');
const flipIcon = document.getElementById('flipIcon');
const card3d = document.getElementById('card3d');
const capSearchBlock = document.getElementById('capSearchBlock');
let mode = 'cap';

function setMode(next){
  if(next === mode) return;
  mode = next;
  toggle.classList.toggle('is-mod', mode === 'mod');
  btnCap.classList.toggle('active', mode === 'cap');
  btnMod.classList.toggle('active', mode === 'mod');
  card3d.classList.toggle('flipped', mode === 'mod');
  capSearchBlock.classList.toggle('hidden-mode', mode === 'mod');
  flipIcon.classList.add('spin');
  setTimeout(()=> flipIcon.classList.remove('spin'), 500);
}
btnCap.addEventListener('click', ()=> setMode('cap'));
btnMod.addEventListener('click', ()=> setMode('mod'));
flipIcon.addEventListener('click', ()=> setMode(mode === 'cap' ? 'mod' : 'cap'));

function tierCell(val){
  if(val === '✓') return `<span class="tval tick">✓</span>`;
  if(val === '—') return `<span class="tval dash">—</span>`;
  return `<span class="tval">${val}</span>`;
}
/* Talent and Recruitment don't offer a Manage tier — drop that column for them */
function hasManageTier(item){ return item.b !== 'Talent' && item.b !== 'Recruitment'; }
/* modules with no plan-tier data — tier info is hidden entirely for these */
const NO_TIER_MODULES = ['Employee Self Service Portal', 'Mobile Application (iOS & Android)'];
function tiersHTML(item){
  if(NO_TIER_MODULES.includes(item.m)) return '';
  const showManage = hasManageTier(item);
  return `
    <div class="tiers${showManage ? '' : ' two-col'}">
      ${showManage ? `<div class="tier-box"><span class="tname">Manage</span>${tierCell(item.t[0])}</div>` : ''}
      <div class="tier-box"><span class="tname">Grow</span>${tierCell(item.t[1])}</div>
      <div class="tier-box"><span class="tname">Transform</span>${tierCell(item.t[2])}</div>
    </div>`;
}
/* ---------------- CAPABILITY -> MODULE ---------------- */
const capInput = document.getElementById('capInput');
const capClear = document.getElementById('capClear');
const capKbd = document.getElementById('capKbd');
const capSuggestions = document.getElementById('capSuggestions');
const listCount = document.getElementById('listCount');
let hiIndex = -1;
let currentMatches = [];
let selectedCapability = null;

function closeAllExpanded(){
  [...capSuggestions.querySelectorAll('.sugg-item.open')].forEach(el => el.classList.remove('open'));
  selectedCapability = null;
}

/* expand/collapse a capability card in place, where it already sits in the list */
function toggleExpand(el, item){
  const wasOpen = el.classList.contains('open');
  closeAllExpanded();
  if(!wasOpen){
    el.classList.add('open');
    selectedCapability = item.c;
  }
}

function renderSuggestions(matches){
  /* group into bundle sections (HR, Time, Pay, …) preserving BUNDLE_ORDER, then original relative order within each */
  const grouped = BUNDLE_ORDER.flatMap(b => matches.filter(d => d.b === b));
  currentMatches = grouped;
  hiIndex = -1;
  listCount.innerHTML = `Showing <b>${grouped.length}</b> of ${DATA.length} capabilities`;
  if(!grouped.length){
    capSuggestions.innerHTML = `<div class="sugg-empty">No capabilities match that search.</div>`;
    return;
  }
  let html = '';
  let lastBundle = null;
  grouped.forEach((item, i) => {
    if(item.b !== lastBundle){
      lastBundle = item.b;
      const count = grouped.filter(d => d.b === item.b).length;
      html += `<div class="bundle-label"><span class="sw" style="background:${BUNDLE_COLOR[item.b]}"></span>${item.b} <span class="bcount">${count}</span></div>`;
    }
    html += `
    <div class="sugg-item${item.c === selectedCapability ? ' open' : ''}" data-i="${i}">
      <div class="sugg-item-head">
        <span class="swatch" style="background:${BUNDLE_COLOR[item.b]}"></span>
        <span class="cap-name">${item.c}</span>
        <span class="mod-name"><span class="sw" style="background:${BUNDLE_COLOR[item.b]}"></span>${item.m}</span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="sugg-item-body">
        <div class="sugg-item-body-inner">
          <p class="desc">${item.d}</p>
          ${tiersHTML(item)}
        </div>
      </div>
    </div>`;
  });
  capSuggestions.innerHTML = html;
  [...capSuggestions.querySelectorAll('.sugg-item')].forEach(el => {
    el.querySelector('.sugg-item-head').addEventListener('click', () => {
      const item = currentMatches[+el.dataset.i];
      toggleExpand(el, item);
    });
  });
}

function filterAndRender(){
  capClear.classList.toggle('show', capInput.value.length > 0);
  capKbd.style.display = capInput.value.length > 0 ? 'none' : '';
  const q = capInput.value.trim().toLowerCase();
  if(!q){
    renderSuggestions(DATA);
    return;
  }
  const nameMatches = DATA.filter(d => d.c.toLowerCase().includes(q));
  const descMatches = DATA.filter(d => !d.c.toLowerCase().includes(q) && d.d.toLowerCase().includes(q));
  renderSuggestions([...nameMatches, ...descMatches]);
}

capInput.addEventListener('input', filterAndRender);
capClear.addEventListener('click', () => {
  capInput.value = '';
  filterAndRender();
  capInput.focus();
});

capInput.addEventListener('keydown', (e) => {
  const items = [...capSuggestions.children].filter(el => el.classList.contains('sugg-item'));
  if(!items.length) return;
  if(e.key === 'ArrowDown'){ e.preventDefault(); hiIndex = Math.min(hiIndex+1, items.length-1); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); hiIndex = Math.max(hiIndex-1, 0); }
  else if(e.key === 'Enter'){
    e.preventDefault();
    const idx = hiIndex >= 0 ? hiIndex : 0;
    const el = items[idx];
    const item = currentMatches[idx];
    if(el && item) toggleExpand(el, item);
    return;
  } else return;
  items.forEach((el,i) => el.classList.toggle('hi', i===hiIndex));
  items[hiIndex] && items[hiIndex].scrollIntoView({block:'nearest'});
});

/* initial render: show all capabilities by default */
renderSuggestions(DATA);

/* ---------------- MODULE -> CAPABILITY ---------------- */
const modGroups = document.getElementById('modGroups');
const modInput = document.getElementById('modInput');
const modClear = document.getElementById('modClear');
const modCount = document.getElementById('modCount');
let expandedModule = null;

const countsByModule = {};
DATA.forEach(d => countsByModule[d.m] = (countsByModule[d.m]||0)+1);

/* modules grouped by bundle, preserving BUNDLE_ORDER and first-seen module order within each */
const MODULES_GROUPED = BUNDLE_ORDER.flatMap(b => MODULE_ORDER.filter(m => MODULE_BUNDLE[m] === b));

/* the accordion of capability theme-groups / rows shown inside an expanded module — same markup as the capability tiers card */
function capabilitiesMarkup(mod){
  const items = DATA.filter(d => d.m === mod);
  const themes = [...new Set(items.map(i => i.th))];
  return themes.map(theme => {
    const rows = items.filter(i => i.th === theme).map((item, idx) => {
      const rid = `${mod}-${theme}-${idx}`.replace(/\s+/g,'_');
      return `
        <div class="row" id="row-${rid}">
          <div class="row-head" data-rid="${rid}">
            <span class="cap-name">${item.c}</span>
            ${NO_TIER_MODULES.includes(item.m) ? '' : `
            <div class="row-ticks">
              ${hasManageTier(item) ? `<span>M <b>${item.t[0]==='✓'?'✓':(item.t[0]==='—'?'—':'●')}</b></span>` : ''}
              <span>G <b>${item.t[1]==='✓'?'✓':(item.t[1]==='—'?'—':'●')}</b></span>
              <span>T <b>${item.t[2]==='✓'?'✓':(item.t[2]==='—'?'—':'●')}</b></span>
            </div>`}
            <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
          </div>
          <div class="row-body">
            <div class="row-body-inner">
              <p>${item.d}</p>
              ${tiersHTML(item)}
            </div>
          </div>
        </div>
      `;
    }).join('');
    return `<div class="theme-group"><h4>${theme}</h4>${rows}</div>`;
  }).join('');
}

function closeAllModules(){
  [...modGroups.querySelectorAll('.mod-item.open')].forEach(el => el.classList.remove('open'));
  expandedModule = null;
}

function toggleModuleExpand(el, m){
  const wasOpen = el.classList.contains('open');
  closeAllModules();
  if(!wasOpen){
    el.classList.add('open');
    expandedModule = m;
  }
}

/* search filters MODULES (across all bundles) — a matching module stays stacked under its bundle */
function renderModGroups(){
  modClear.classList.toggle('show', modInput.value.length > 0);
  const q = modInput.value.trim().toLowerCase();
  const filtered = MODULES_GROUPED.filter(m => !q || m.toLowerCase().includes(q));
  modCount.innerHTML = `Showing <b>${filtered.length}</b> of ${MODULES_GROUPED.length} modules`;

  if(!filtered.length){
    modGroups.innerHTML = `<div class="mod-empty">No modules match "${q}".</div>`;
    return;
  }

  let html = '';
  let lastBundle = null;
  filtered.forEach(m => {
    const b = MODULE_BUNDLE[m];
    if(b !== lastBundle){
      lastBundle = b;
      const count = filtered.filter(mm => MODULE_BUNDLE[mm] === b).length;
      html += `<div class="bundle-label"><span class="sw" style="background:${BUNDLE_COLOR[b]}"></span>${b} <span class="bcount">${count}</span></div>`;
    }
    html += `
    <div class="mod-item${m === expandedModule ? ' open' : ''}" data-m="${m}">
      <div class="mod-item-head">
        <span class="swatch" style="background:${BUNDLE_COLOR[b]}"></span>
        <span class="mod-item-name">${m}</span>
        <span class="mod-item-count">${countsByModule[m]||0} capabilities</span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="mod-item-body">
        <div class="mod-item-body-inner">
          ${capabilitiesMarkup(m)}
        </div>
      </div>
    </div>`;
  });
  modGroups.innerHTML = html;

  [...modGroups.querySelectorAll('.mod-item')].forEach(el => {
    el.querySelector('.mod-item-head').addEventListener('click', () => toggleModuleExpand(el, el.dataset.m));
  });
  [...modGroups.querySelectorAll('.row-head')].forEach(head => {
    head.addEventListener('click', () => head.closest('.row').classList.toggle('open'));
  });
}
modInput.addEventListener('input', renderModGroups);
modClear.addEventListener('click', () => {
  modInput.value = '';
  renderModGroups();
  modInput.focus();
});

/* initial render: no module expanded by default */
renderModGroups();
</script>
